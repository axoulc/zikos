[package]
# Underscored on purpose: cargokit derives the built library's file name
# (libzikos_bridge.so/.a) from the package name verbatim, and the Flutter
# plugin integration files (podspec, apply_cargokit) reference
# `zikos_bridge` — a dashed name would never match the artifacts.
name = "zikos_bridge"
description = "flutter_rust_bridge surface over the Zikos Rust core: the only code the Flutter app calls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
zikos-core = { workspace = true }
zikos-audio = { workspace = true }
zikos-matrix = { workspace = true }
flutter_rust_bridge = "=2.13.0"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
jiff = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
zikos-crypto = { workspace = true }
